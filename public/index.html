<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoLive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen">
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-slate-950 font-bold">🪙</div>
                <h1 class="text-xl font-bold text-white tracking-tight">CryptoLive Dashboard</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div id="last-update" class="text-xs text-slate-500">Last updated: Never</div>
                <button id="refresh-btn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-2">
                    <span>Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div id="crypto-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading States -->
            <div class="crypto-card animate-pulse h-48"></div>
            <div class="crypto-card animate-pulse h-48"></div>
            <div class="crypto-card animate-pulse h-48"></div>
            <div class="crypto-card animate-pulse h-48"></div>
        </div>
    </main>

    <footer class="border-t border-slate-800 mt-12 py-8">
        <div class="container mx-auto px-6 text-center text-sm text-slate-500">
            &copy; 2026 CryptoLive Dashboard. Powered by Indodax API.
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
